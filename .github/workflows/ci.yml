# No build logic here: every step calls build.sh or build.ps1, so the same checks run the
# same way on a laptop.
name: ci

on:
  push:
  pull_request:

# The jobs only read the repository. Actions are pinned to commit SHAs (tags can be
# moved); the comment says which release each SHA is.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: ./build.sh check

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # An X server without a screen: the window suite opens a real X11 window.
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run -a ./build.sh test
      # ...and a window must really open there (the suite also passes where Open says no)
      - run: |
          out=$(ENVO_WINDOW_REQUIRED=1 xvfb-run -a build/envo/envo run --native tests/conformance/window/window.envol)
          echo "$out"
          [ "$out" = "window: done" ]
      # The X11 clipboard both ways with another program
      - run: command -v xclip || (sudo apt-get update && sudo apt-get install -y xclip)
      - run: xvfb-run -a sh adapters/os/linux/x11/check/clipboard.sh build/envo/envo
      # The VS Code extension against the envo just built
      - run: ENVO=build/envo/envo node --test adapters/editors/vscode/test/*.test.js
      - run: ./build.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-on-linux
          path: |
            build/envoc/envoc
            build/envoc/envoc.exe
            build/envo/envo
            build/envo/envo.exe
            build/dist/SHA256SUMS
            build/dist/*.tar
            build/dist/*.provenance.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: .\build.ps1 check
        shell: powershell
      - run: .\build.ps1 test
        shell: powershell
      - run: .\build.ps1 dist
        shell: powershell
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-on-windows
          path: |
            build/envoc/envoc
            build/envoc/envoc.exe
            build/envo/envo
            build/envo/envo.exe
            build/dist/SHA256SUMS

  # The same sources must give byte-identical compilers, tools and release archives on
  # both hosts.
  reproducible:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-on-linux
          path: build/from-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-on-windows
          path: build/from-windows
      - run: ./build.sh compare build/from-linux build/from-windows

  # The run and library tests built for aarch64-linux and aarch64-macos on x86-64, then
  # run on arm64 Linux and macOS machines.
  aarch64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: ./build.sh cross
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aarch64-linux-programs
          path: build/cross/aarch64-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aarch64-macos-programs
          path: build/cross/aarch64-macos

  aarch64-linux:
    needs: [aarch64-build]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aarch64-linux-programs
          path: build/cross/aarch64-linux
      - run: ./build.sh cross-run build/cross/aarch64-linux

  aarch64-macos:
    needs: [aarch64-build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aarch64-macos-programs
          path: build/cross/aarch64-macos
      - run: ./build.sh cross-run build/cross/aarch64-macos

  # A tag v<version> publishes the archive, once both hosts built the same bytes and the
  # AArch64 tests passed. The notes are docs/releases/<tag>.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [reproducible, aarch64-linux, aarch64-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-on-linux
          path: build/from-linux
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          [ -f "build/from-linux/dist/envoscale-$v.tar" ] || { echo "the tag $GITHUB_REF_NAME does not match ENVO_VERSION"; exit 1; }
          gh release create "$GITHUB_REF_NAME" build/from-linux/dist/* --repo "$GITHUB_REPOSITORY" --title "EnvoScale $v" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
