# Temporary diagnostic: Stage 0 assembled by the runner's NASM through the adapter, to check
# that NASM 3.01 (ubuntu 26.04) now gives the same bytes as NASM 2.16 and 3.02. Remove once
# confirmed.
name: nasm-diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh adapters/ci/github/install-nasm.sh
      - run: |
          sh adapters/bootstrap/nasm/assemble.sh bootstrap/stage0/envoc0-linux.eas /tmp/envoc0 bootstrap/stage0
          sh adapters/bootstrap/nasm/assemble.sh bootstrap/stage0/envoc0-windows.eas /tmp/envoc0.exe bootstrap/stage0
          sha256sum /tmp/envoc0 /tmp/envoc0.exe
